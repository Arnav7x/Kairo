languages:
  - id: "python"
    name: "Python 3.12"
    image: "kairo-runner-python:latest"
    filename: "main.py"
    compiled: false
    aliases:
      - "py"
    run_cmd:
      - "python3"
      - "main.py"
    default_limits:
      timeout_ms: 10000
      memory_mb: 256
      output_bytes: 1048576
      cpu_nano_cores: 500000000
      pids_limit: 64

  - id: "node"
    name: "Node.js 22"
    image: "kairo-runner-node:latest"
    filename: "main.js"
    compiled: false
    aliases:
      - "nodejs"
      - "javascript"
      - "js"
    run_cmd:
      - "node"
      - "main.js"
    default_limits:
      timeout_ms: 10000
      memory_mb: 256
      output_bytes: 1048576
      cpu_nano_cores: 500000000
      pids_limit: 64

  - id: "bash"
    name: "Bash 5.2"
    image: "kairo-runner-bash:latest"
    filename: "main.sh"
    compiled: false
    aliases:
      - "sh"
      - "shell"
    run_cmd:
      - "bash"
      - "main.sh"
    default_limits:
      timeout_ms: 10000
      memory_mb: 128
      output_bytes: 1048576
      cpu_nano_cores: 500000000
      pids_limit: 64

  - id: "c"
    name: "C (GCC 13)"
    image: "kairo-runner-c:latest"
    filename: "main.c"
    compiled: true
    compile_cmd:
      - "gcc"
      - "-O2"
      - "-Wall"
      - "-o"
      - "main"
      - "main.c"
    run_cmd:
      - "./main"
    default_limits:
      timeout_ms: 10000
      memory_mb: 128
      output_bytes: 1048576
      cpu_nano_cores: 500000000
      pids_limit: 64
    compile_limits:
      timeout_ms: 5000
      memory_mb: 96
      output_bytes: 1048576
      cpu_nano_cores: 1000000000
      pids_limit: 64

  - id: "cpp"
    name: "C++ (G++ 13)"
    image: "kairo-runner-cpp:latest"
    filename: "main.cpp"
    compiled: true
    aliases:
      - "c++"
    compile_cmd:
      - "g++"
      - "-O2"
      - "-Wall"
      - "-o"
      - "main"
      - "main.cpp"
    run_cmd:
      - "./main"
    default_limits:
      timeout_ms: 10000
      memory_mb: 128
      output_bytes: 1048576
      cpu_nano_cores: 500000000
      pids_limit: 64
    compile_limits:
      timeout_ms: 5000
      memory_mb: 96
      output_bytes: 1048576
      cpu_nano_cores: 1000000000
      pids_limit: 64

  - id: "go"
    name: "Go 1.22"
    image: "kairo-runner-go:latest"
    filename: "main.go"
    compiled: true
    aliases:
      - "golang"
    compile_cmd:
      - "go"
      - "build"
      - "-o"
      - "main"
      - "main.go"
    run_cmd:
      - "./main"
    default_limits:
      timeout_ms: 90000
      memory_mb: 512
      output_bytes: 1048576
      cpu_nano_cores: 500000000
      pids_limit: 64
    compile_limits:
      timeout_ms: 60000
      memory_mb: 256
      output_bytes: 1048576
      cpu_nano_cores: 1000000000
      pids_limit: 64

  - id: "rust"
    name: "Rust 1.78"
    image: "kairo-runner-rust:latest"
    filename: "main.rs"
    compiled: true
    compile_cmd:
      - "rustc"
      - "-O"
      - "-o"
      - "main"
      - "main.rs"
    run_cmd:
      - "./main"
    default_limits:
      timeout_ms: 30000
      memory_mb: 1024
      output_bytes: 1048576
      cpu_nano_cores: 500000000
      pids_limit: 64
    compile_limits:
      timeout_ms: 15000
      memory_mb: 512
      output_bytes: 1048576
      cpu_nano_cores: 1000000000
      pids_limit: 64

  - id: "java"
    name: "Java 21"
    image: "kairo-runner-java:latest"
    filename: "Main.java"
    compiled: true
    compile_cmd:
      - "javac"
      - "Main.java"
    run_cmd:
      - "java"
      - "Main"
    default_limits:
      timeout_ms: 10000
      memory_mb: 512
      output_bytes: 1048576
      cpu_nano_cores: 500000000
      pids_limit: 64
    compile_limits:
      timeout_ms: 8000
      memory_mb: 384
      output_bytes: 1048576
      cpu_nano_cores: 1000000000
      pids_limit: 64

